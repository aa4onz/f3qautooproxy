[package]
name = "fast_discord_tui"
version = "0.3.0"
edition = "2021"

[[bin]]
name = "remote_proxy"
path = "src/bin/remote_proxy.rs"

[dependencies]
# Asynchronous runtime and low-latency networking
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"
reqwest = { version = "0.11", features = ["json"] }

# Data serialization and parsing
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Timestamps and utilities
chrono = "0.4"
rand = "0.8"

# Environment configuration for proxy
dotenvy = "0.15"
